name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies install
        run: pip install -r requirements-dev.txt

      - name: Tests 
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Docker image build
        run: docker build -t cicd-demo-app:ci .
