name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies install
        run: pip install -r requirements-dev.txt

      - name: Tests chalao
        run: pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx setup
        uses: docker/setup-buildx-action@v3

      - name: Build aur push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Naya image pull karo
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:latest

      - name: Purana container hatao
        run: docker rm -f demo || true

      - name: Naya container chalao
        run: docker run -d --name demo -p 5000:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:latest

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
